<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Light You Left On / Noah Vale</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0e1024;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0e1024}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;transform-origin:top left;
  font-family:"Noto Sans JP",system-ui,sans-serif;background:#0e1024}
#world{position:absolute;inset:0;transform-origin:50% 48%}
/* sunset sky */
#sky{position:absolute;left:0;right:0;top:0;height:900px;background:
  linear-gradient(180deg,#18204a 0%,#2a2f5e 26%,#5a4068 46%,#9a4f62 62%,#d9704e 78%,#ff9a52 92%,#ffc277 100%)}
#duskdeep{position:absolute;left:0;right:0;top:0;height:900px;opacity:0;background:linear-gradient(180deg,rgba(10,14,40,.5),rgba(20,20,48,.2) 50%,transparent 80%)}
.cloud{position:absolute;border-radius:50%;filter:blur(16px)}
#sun{position:absolute;left:150px;top:690px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle,#fff2d0,#ffcf7a 54%,#ff9a44 100%);box-shadow:0 0 70px 24px rgba(255,170,90,.6),0 0 160px 60px rgba(255,140,80,.3)}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#dfe6ff}
/* mountains */
.mtn{position:absolute;bottom:0;background:linear-gradient(180deg,#3a3a5e,#20203e)}
#mtnwrap{position:absolute;left:0;right:0;top:720px;height:200px;overflow:hidden}
/* valley lake + town */
#valley{position:absolute;left:0;right:0;top:820px;height:360px;background:linear-gradient(180deg,#2a2b46,#1a1b30)}
#lake{position:absolute;left:0;top:828px;width:620px;height:70px;filter:blur(1.5px);
  background:radial-gradient(50% 120% at 30% 0%, rgba(255,180,110,.6), rgba(120,130,175,.28) 55%, rgba(60,66,100,.1) 100%);
  -webkit-mask:linear-gradient(180deg,#000,transparent);mask:linear-gradient(180deg,#000,transparent)}
.townlt{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,200,130,.95);box-shadow:0 0 6px 1px rgba(255,190,100,.8)}
#road{position:absolute;left:-60px;top:1180px;width:520px;height:560px;z-index:2;opacity:.34;
  background:linear-gradient(180deg, rgba(120,120,140,.0), rgba(140,140,158,.5) 50%, rgba(165,165,180,.7));
  clip-path:polygon(46% 0,54% 0,78% 100%,8% 100%);filter:blur(1.4px);transform:skewX(-10deg)}
#roadglow{position:absolute;left:-60px;top:1180px;width:520px;height:560px;z-index:2;mix-blend-mode:screen;opacity:.3;
  background:linear-gradient(180deg,transparent,rgba(255,180,110,.28));clip-path:polygon(48% 0,52% 0,64% 100%,36% 100%);transform:skewX(-10deg)}
.bush{position:absolute;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 40% 30%,#3a4a2e,#1e2a16)}
.redbush{position:absolute;border-radius:50%;background:radial-gradient(circle,#b2402e,#6a2018);filter:blur(1px)}
/* cabin porch (right) */
#porch{position:absolute;right:0;top:0;bottom:0;width:560px;z-index:4}
#wall{position:absolute;right:0;top:300px;bottom:0;width:430px;background:linear-gradient(90deg,#2a1d12,#3a281a 40%,#2a1c10)}
#wallglow{position:absolute;right:0;top:360px;width:430px;height:900px;pointer-events:none;z-index:1;
  background:radial-gradient(60% 50% at 78% 10%, rgba(255,175,85,.38), transparent 62%)}
#roofbeam{position:absolute;right:0;top:300px;width:560px;height:60px;background:linear-gradient(180deg,#1a1109,#120b05);transform:skewY(-4deg);transform-origin:right top}
#post1{position:absolute;right:430px;top:320px;bottom:0;width:36px;background:linear-gradient(90deg,#4a3420,#2a1c10)}
#post2{position:absolute;right:120px;top:300px;bottom:300px;width:30px;background:linear-gradient(90deg,#4a3420,#2a1c10)}
.pwin{position:absolute;border-radius:4px;overflow:hidden;background:radial-gradient(circle at 50% 40%, #ffe6a6, #ffb858 55%, #e08a30 100%);box-shadow:0 0 50px 14px rgba(255,180,90,.45)}
.pwin .mull{position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,rgba(60,40,20,.8) 49% 51%,transparent 52%),linear-gradient(180deg,transparent 31%,rgba(60,40,20,.8) 32% 34%,transparent 35%),linear-gradient(180deg,transparent 64%,rgba(60,40,20,.8) 65% 67%,transparent 68%)}
.pwin .lamp{position:absolute;left:30%;top:34%;width:40%;height:34%;border-radius:50% 50% 8px 8px;background:radial-gradient(circle at 50% 30%,#fff6d8,#ffca6a);filter:blur(1px)}
#win1{right:150px;top:360px;width:120px;height:240px}
#win2{right:10px;top:360px;width:120px;height:240px}
#hanglan{position:absolute;right:300px;top:360px;width:40px;height:100px;z-index:5}
#hanglan .cord{position:absolute;left:50%;top:-40px;width:3px;height:44px;background:#1a1109;transform:translateX(-50%)}
#hanglan .body{position:absolute;left:0;top:40px;width:40px;height:56px;border-radius:6px;border:3px solid #2a1c10;background:linear-gradient(180deg,rgba(255,210,140,.5),rgba(150,100,50,.5));box-shadow:0 0 40px 12px rgba(255,180,90,.6)}
#hanglan .fl{position:absolute;left:14px;top:58px;width:12px;height:20px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff3c4,#ffb43a);box-shadow:0 0 16px 5px rgba(255,160,60,.8)}
#floor{position:absolute;right:0;bottom:0;width:560px;height:360px;z-index:4;background:linear-gradient(180deg,#5a3f24 0%,#3d2a14 50%,#2a1a0c 100%);
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 2px,transparent 2px 46px)}
#floorglow{position:absolute;right:0;bottom:0;width:560px;height:420px;z-index:4;pointer-events:none;
  background:radial-gradient(70% 90% at 72% 20%, rgba(255,170,80,.34), transparent 66%)}
#steps{position:absolute;right:300px;bottom:0;width:260px;height:120px;z-index:4;background:linear-gradient(180deg,#3a2816,#241608);
  background-image:repeating-linear-gradient(180deg,rgba(255,210,150,.12) 0 2px,transparent 2px 40px)}
#railing{position:absolute;right:0;bottom:300px;width:470px;height:14px;z-index:4;background:linear-gradient(180deg,#5a4026,#33210f);border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
/* rocking chair (silhouette) with warm rim */
#chair{position:absolute;right:150px;bottom:230px;width:230px;height:320px;z-index:5}
#chairback{position:absolute;right:40px;bottom:70px;width:140px;height:230px;z-index:5;background:#17100a;
  clip-path:polygon(2% 100%,0 16%,14% 2%,30% 0,34% 94%,66% 96%,70% 2%,86% 4%,100% 18%,98% 100%);box-shadow:inset -8px 0 0 -4px rgba(255,180,90,.35)}
#chairseat{position:absolute;right:24px;bottom:66px;width:200px;height:26px;background:#17100a;border-radius:8px;transform:rotate(-2deg)}
#chairrock{position:absolute;right:24px;bottom:12px;width:210px;height:30px;border:7px solid #17100a;border-top:none;border-radius:0 0 120px 120px;background:transparent}
#blanket{position:absolute;right:66px;bottom:150px;width:150px;height:170px;z-index:6;
  background:repeating-linear-gradient(42deg,#b2402e 0 16px,#d98a4a 16px 28px,#6a4330 28px 40px);
  clip-path:polygon(6% 2%,80% 0,100% 54%,78% 100%,34% 92%,0 60%);opacity:.96;border-radius:6px;box-shadow:inset -10px 0 0 -6px rgba(255,180,90,.3)}
/* guitar case */
#guitar{position:absolute;right:380px;bottom:210px;width:120px;height:310px;z-index:5;transform:rotate(12deg)}
#gcase{position:absolute;inset:0;background:linear-gradient(120deg,#4a301a,#241509);border-radius:46px 46px 54px 54px;box-shadow:0 10px 24px rgba(0,0,0,.5),inset -8px 0 0 -4px rgba(255,180,90,.25)}
#gcase::after{content:"";position:absolute;left:20px;top:34px;width:80px;height:200px;border:3px solid rgba(255,190,110,.3);border-radius:40px}
/* side table + cup + lantern */
#table{position:absolute;right:6px;bottom:230px;width:130px;height:120px;z-index:5;background:linear-gradient(180deg,#4a301a,#2a1a0c);border-radius:6px;box-shadow:inset -8px 0 0 -4px rgba(255,180,90,.25)}
#tlan{position:absolute;right:18px;bottom:342px;width:44px;height:78px;z-index:6;border-radius:6px 6px 8px 8px;border:3px solid #2a1c10;
  background:linear-gradient(180deg,rgba(255,215,150,.6),rgba(160,105,55,.55));box-shadow:0 0 40px 12px rgba(255,180,90,.7)}
#cup{position:absolute;right:78px;bottom:344px;width:46px;height:38px;z-index:6;background:linear-gradient(180deg,#efe7d9,#c0b49e);border-radius:6px 6px 12px 12px}
#cup::after{content:"";position:absolute;right:-13px;top:8px;width:16px;height:18px;border:5px solid #dccfbc;border-radius:0 40px 40px 0}
.stm{position:absolute;right:92px;bottom:384px;width:7px;height:22px;border-radius:5px;background:linear-gradient(180deg,rgba(245,235,215,.65),transparent);filter:blur(2px)}
/* leaves + bokeh + fireflies */
.leaf{position:absolute;border-radius:60% 10% 60% 10%;opacity:.85;z-index:7}
.bok{position:absolute;border-radius:50%;filter:blur(5px);z-index:7}
.ff{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff0b0,transparent 70%);z-index:7}
/* text */
#titlewrap{position:absolute;left:50px;right:50px;top:120px;text-align:center;z-index:9;opacity:0}
.title-en{font-family:"Noto Serif JP",serif;font-size:78px;font-weight:600;line-height:1.08;letter-spacing:1px;color:#fdf3df;
  text-shadow:0 3px 22px rgba(0,0,0,.6),0 0 30px rgba(255,210,140,.4)}
.artist-top{font-family:"Noto Serif JP",serif;font-style:italic;font-size:38px;letter-spacing:8px;color:#ecd9b6;margin-top:10px}
#scenes{position:absolute;left:56px;right:56px;top:320px;height:440px;z-index:9}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;will-change:opacity,transform}
.lyr{font-family:"Noto Serif JP",serif;font-size:60px;font-weight:600;line-height:1.3;letter-spacing:1px;color:#fdf6e8;
  text-shadow:0 3px 22px rgba(0,0,0,.8),0 0 22px rgba(255,200,130,.3)}
.lyr .hl{color:#ffdc9b}
.lyr .jp{display:block;font-family:"Noto Sans JP";font-size:34px;font-weight:600;color:#eccf9f;letter-spacing:1px;margin-top:14px;text-shadow:0 2px 12px rgba(0,0,0,.85)}
.badge{display:inline-block;font-family:"Noto Sans JP";font-size:27px;font-weight:800;letter-spacing:4px;color:#5a2c10;
  background:linear-gradient(90deg,#ffe6ad,#ffc06a);padding:9px 24px;border-radius:40px;margin-bottom:18px}
.cta-t{font-family:"Noto Serif JP",serif;font-size:76px;font-weight:600;line-height:1.08;color:#fdf3df;text-shadow:0 0 28px rgba(255,210,140,.4)}
.cta-a{font-family:"Noto Serif JP",serif;font-style:italic;font-size:42px;letter-spacing:7px;color:#ecd9b6;margin-top:12px}
.cta-s{font-size:30px;color:#e6d2ae;letter-spacing:2px;margin-top:18px}
#vig{position:absolute;inset:0;pointer-events:none;z-index:10;background:radial-gradient(130% 80% at 44% 46%,transparent 55%,rgba(0,0,0,.52) 100%)}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20}
#play{width:150px;height:150px;border-radius:50%;border:none;cursor:pointer;color:#5a2c10;font-size:60px;background:linear-gradient(135deg,#ffe6ad,#ffc06a);box-shadow:0 10px 40px rgba(0,0,0,.5)}
#bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.12);z-index:20}
#barf{height:100%;width:0;background:linear-gradient(90deg,#ffe6ad,#ffc06a)}
body.capture #ui,body.capture #bar{display:none}
</style></head>
<body>

<div id="wrap"><div id="stage">
 <div id="world">
  <div id="sky"></div>
  <div id="starf"></div>
  <div id="clouds"></div>
  <div id="sun"></div>
  <div id="mtnwrap"></div>
  <div id="valley"></div>
  <div id="lake"></div>
  <div id="townf"></div>
  <div id="road"></div><div id="roadglow"></div>
  <div id="bushf"></div>
  <div id="duskdeep"></div>
  <!-- porch -->
  <div id="porch">
    <div id="wall"></div><div id="wallglow"></div>
    <div id="roofbeam"></div>
    <div class="pwin" id="win1"><div class="lamp"></div><div class="mull"></div></div>
    <div class="pwin" id="win2"><div class="lamp"></div><div class="mull"></div></div>
    <div id="post1"></div><div id="post2"></div>
    <div id="hanglan"><div class="cord"></div><div class="body"></div><div class="fl"></div></div>
    <div id="floor"></div><div id="floorglow"></div><div id="steps"></div><div id="railing"></div>
    <div id="guitar"><div id="gcase"></div></div>
    <div id="chair"><div id="chairback"></div><div id="chairseat"></div><div id="chairrock"></div></div>
    <div id="blanket"></div>
    <div id="table"></div><div id="tlan"></div><div id="cup"></div><div id="steamf"></div>
  </div>
  <div id="leaff"></div>
  <div id="bokf"></div>
  <div id="fff"></div>
 </div>
 <div id="titlewrap"><div class="title-en">The Light<br>You Left On</div><div class="artist-top">Noah Vale</div></div>
 <div id="scenes"></div>
 <div id="vig"></div>
 <div id="ui"><button id="play">&#9654;</button></div>
 <div id="bar"><div id="barf"></div></div>
</div></div>
<audio id="bgm" src="light-left-bgm.mp3" preload="auto"></audio>

<script>

const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform='scale('+s+')';
  document.getElementById('wrap').style.width=innerWidth+'px';}
addEventListener('resize',fit);fit();
const capture=new URLSearchParams(location.search).has('capture');
if(capture)document.body.classList.add('capture');
let _s=10062026;function rnd(){_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff;}

// stars
const starf=document.getElementById('starf');const stars=[];
for(let i=0;i<50;i++){const d=document.createElement('div');d.className='star';d.style.left=(rnd()*1080)+'px';d.style.top=(rnd()*460)+'px';starf.appendChild(d);stars.push({el:d,ph:rnd()*6.28,sp:0.7+rnd()*1.6});}
// clouds
const cl=document.getElementById('clouds');const clouds=[];
const ccol=['rgba(217,112,78,.5)','rgba(90,64,104,.5)','rgba(255,154,82,.4)'];
for(let i=0;i<6;i++){const c=document.createElement('div');c.className='cloud';const w=240+rnd()*320,h=56+rnd()*56;
  c.style.width=w+'px';c.style.height=h+'px';c.style.left=(rnd()*820-60)+'px';c.style.top=(360+rnd()*320)+'px';
  c.style.background='radial-gradient(circle,'+ccol[(rnd()*3)|0]+',transparent 70%)';cl.appendChild(c);clouds.push({el:c,ph:rnd()*6.28});}
// mountains
const mw=document.getElementById('mtnwrap');
let mx=-40;while(mx<1120){const m=document.createElement('div');m.className='mtn';const w=180+rnd()*180,h=90+rnd()*100;
  m.style.left=mx+'px';m.style.width=w+'px';m.style.height=h+'px';m.style.clipPath='polygon(50% 0,100% 100%,0 100%)';mw.appendChild(m);mx+=w*0.6;}
// town lights
const townf=document.getElementById('townf');const towns=[];
for(let i=0;i<40;i++){const d=document.createElement('div');d.className='townlt';d.style.left=(60+rnd()*520)+'px';d.style.top=(900+rnd()*120)+'px';townf.appendChild(d);towns.push({el:d,ph:rnd()*6.28,sp:0.6+rnd()*1.8});}
// foliage: low dark bushes hugging the bottom edge (not over the road)
const bushf=document.getElementById('bushf');
[[-40,1760,320,180],[150,1820,240,150],[-20,1860,200,120]].forEach(([x,y,w,h])=>{const b=document.createElement('div');b.className='bush';b.style.left=x+'px';b.style.top=y+'px';b.style.width=w+'px';b.style.height=h+'px';bushf.appendChild(b);});
for(const [x,y,s] of [[40,1800,46],[210,1840,40],[120,1860,44]]){const r=document.createElement('div');r.className='redbush';r.style.left=x+'px';r.style.top=y+'px';r.style.width=s+'px';r.style.height=s+'px';bushf.appendChild(r);}
// steam
const steamf=document.getElementById('steamf');const stm=[];
for(let i=0;i<4;i++){const p=document.createElement('div');p.className='stm';p.style.right=(80+i*8)+'px';steamf.appendChild(p);stm.push(p);}
// leaves
const leaff=document.getElementById('leaff');const leaves=[];
for(let i=0;i<14;i++){const l=document.createElement('div');l.className='leaf';const sz=14+rnd()*16;l.style.width=sz+'px';l.style.height=sz*0.7+'px';
  l.style.background='linear-gradient(120deg,'+(rnd()<0.5?'#e8863a,#c7472e':'#d9a53a,#b2402e')+')';leaff.appendChild(l);
  leaves.push({el:l,x:rnd()*1080,y:rnd()*1900,sp:28+rnd()*40,drift:24+rnd()*40,ph:rnd()*6.28,rot:rnd()*360,rs:(rnd()-0.5)*80});}
// bokeh
const bokf=document.getElementById('bokf');const boks=[];
for(let i=0;i<14;i++){const b=document.createElement('div');b.className='bok';const sz=14+rnd()*34;b.style.width=sz+'px';b.style.height=sz+'px';
  b.style.left=(rnd()*1080)+'px';b.style.top=(600+rnd()*1200)+'px';b.style.background='radial-gradient(circle,rgba(255,190,110,.5),transparent 70%)';bokf.appendChild(b);boks.push({el:b,ph:rnd()*6.28,sp:0.4+rnd()*1.2});}
// fireflies near porch
const fff=document.getElementById('fff');const ffs=[];
for(let i=0;i<12;i++){const f=document.createElement('div');f.className='ff';const sz=4+rnd()*5;f.style.width=sz+'px';f.style.height=sz+'px';
  f.style.left=(560+rnd()*520)+'px';f.style.top=(700+rnd()*900)+'px';fff.appendChild(f);ffs.push({el:f,x:parseFloat(f.style.left),y:parseFloat(f.style.top),ph:rnd()*6.28,sp:0.5+rnd()*1.2});}

const win1=document.getElementById('win1'),win2=document.getElementById('win2'),hanglanfl=document.querySelector('#hanglan .fl'),
  sun=document.getElementById('sun'),duskdeep=document.getElementById('duskdeep'),titlewrap=document.getElementById('titlewrap');

// scenes (BGM 4:14 start; final chorus belt ~ +3s)
const scenes=[
 {s:3000, e:7000,  html:'<div class="sc"><div class="lyr"><span class="hl">You left the light on</span><span class="jp">あなたは 灯りを 点けたままにしてくれた</span></div></div>'},
 {s:7000, e:11000, html:'<div class="sc"><div class="lyr">When I was too proud<br>to come home</div></div>'},
 {s:11000,e:15000, html:'<div class="sc"><div class="lyr">You only asked<br>if I\'d come home<span class="jp">ただ「帰ってきたの?」と だけ</span></div></div>'},
 {s:15000,e:19000, html:'<div class="sc"><div class="lyr">I was the moth,<br>I was the storm</div></div>'},
 {s:19000,e:23000, html:'<div class="sc"><div class="lyr">I was the one<br>who got it wrong</div></div>'},
 {s:23000,e:27000, html:'<div class="sc"><div class="lyr"><span class="hl">But you left<br>the light on</span><span class="jp">それでも 灯りは 点いていた</span></div></div>'},
 {s:27000,e:31000, html:'<div class="sc"><span class="badge">NEW SINGLE</span><div class="cta-t">The Light You Left On</div><div class="cta-a">Noah Vale</div><div class="cta-s">配信中 &nbsp;/&nbsp; Streaming Now</div></div>'},
];
const scEls=[];const marks=[];const scenesEl=document.getElementById('scenes');
scenes.forEach(sc=>{const w=document.createElement('div');w.innerHTML=sc.html;const el=w.firstElementChild;
  scenesEl.appendChild(el);scEls.push(el);marks.push({start:sc.s,end:sc.e});});
const TOTAL=31000;window.TOTAL=TOTAL;
function smooth(t,a,b){if(t<=a)return 0;if(t>=b)return 1;const x=(t-a)/(b-a);return x*x*(3-2*x);}

window.renderAt=function(t){
  const ts=t/1000,prog=t/TOTAL;
  // dusk deepens so the warm window light stands out more (into the chorus)
  const dusk=smooth(t,2000,18000);
  duskdeep.style.opacity=(0.7*dusk).toFixed(3);
  sun.style.opacity=(1-0.5*dusk).toFixed(3);
  // window light glows warmer/brighter at chorus (the "light you left on")
  const glow=0.85+0.15*Math.sin(ts*1.3)+0.25*dusk;
  const gsh='0 0 '+(50+30*dusk)+'px '+(14+8*dusk)+'px rgba(255,180,90,'+(0.45+0.25*dusk)+')';
  win1.style.boxShadow=gsh;win2.style.boxShadow=gsh;win1.style.filter='brightness('+glow.toFixed(2)+')';win2.style.filter='brightness('+glow.toFixed(2)+')';
  // stars appear with dusk
  for(const s of stars)s.el.style.opacity=((0.3+0.7*Math.abs(Math.sin(ts*s.sp+s.ph)))*dusk).toFixed(3);
  // clouds drift
  for(const c of clouds)c.el.style.transform='translateX('+(Math.sin(ts*0.1+c.ph)*14).toFixed(1)+'px)';
  // town + firefly twinkle
  for(const d of towns)d.el.style.opacity=(0.5+0.5*Math.sin(ts*d.sp+d.ph)).toFixed(3);
  for(const f of ffs){f.el.style.transform='translate('+(Math.sin(ts*0.6+f.ph)*22).toFixed(1)+'px,'+(Math.cos(ts*0.5+f.ph)*18).toFixed(1)+'px)';f.el.style.opacity=(0.3+0.6*Math.abs(Math.sin(ts*f.sp+f.ph))).toFixed(3);}
  // hanging lantern flame
  const fk=Math.sin(ts*12)*0.5+Math.sin(ts*27+1)*0.3;hanglanfl.style.transform='scaleY('+(1+fk*0.14).toFixed(3)+')';hanglanfl.style.opacity=(0.9+0.1*fk).toFixed(3);
  // steam
  stm.forEach((p,i)=>{const y=((ts*24+i*26)%90);p.style.transform='translate('+(Math.sin((ts+i)*1.4)*8).toFixed(1)+'px,'+(-y).toFixed(1)+'px)';p.style.opacity=((1-y/90)*0.5).toFixed(3);});
  // leaves
  for(const l of leaves){let y=(l.y+ts*l.sp)%1940;const xx=l.x+Math.sin(ts*0.7+l.ph)*l.drift;
    l.el.style.transform='translate('+xx.toFixed(1)+'px,'+y.toFixed(1)+'px) rotate('+(l.rot+ts*l.rs*0.4).toFixed(0)+'deg)';l.el.style.opacity='0.8';}
  // bokeh
  for(const b of boks){b.el.style.opacity=(0.4+0.4*Math.sin(ts*b.sp+b.ph)).toFixed(3);b.el.style.transform='translateY('+(Math.sin(ts*0.3+b.ph)*8).toFixed(1)+'px)';}
  // world slow push-in toward porch
  document.getElementById('world').style.transform='scale('+(1+0.04*prog).toFixed(4)+') translate('+(6*prog).toFixed(1)+'px,'+(-4*prog).toFixed(1)+'px)';
  // title then CTA
  titlewrap.style.opacity=Math.max(0,Math.min(smooth(t,400,1400),1-smooth(t,2400,3000))).toFixed(3);
  // scenes (fade within own [start,end])
  const FADE=260;
  for(let i=0;i<scEls.length;i++){const m=marks[i];const o=smooth(t,m.start,m.start+FADE)*(1-smooth(t,m.end-FADE,m.end));
    scEls[i].style.opacity=o.toFixed(3);scEls[i].style.transform='translateY('+(14*(1-o)).toFixed(1)+'px)';}
};

const bgm=document.getElementById('bgm');const barf=document.getElementById('barf');let t0=0;
function play(){document.getElementById('ui').style.display='none';
  try{bgm.currentTime=0;bgm.play();}catch(e){}
  t0=performance.now();
  (function loop(){const t=performance.now()-t0;const tt=Math.min(t,TOTAL);window.renderAt(tt);
    barf.style.width=(100*tt/TOTAL)+'%';if(t<TOTAL)requestAnimationFrame(loop);})();
  setTimeout(()=>{const st=performance.now();(function fo(){const k=(performance.now()-st)/1600;
    bgm.volume=Math.max(0,0.92*(1-k));if(k<1)requestAnimationFrame(fo);else bgm.pause();})();},TOTAL-1600);
}
document.getElementById('play').addEventListener('click',play);
window.renderAt(0);

</script>
