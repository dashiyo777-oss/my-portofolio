<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スノーグローブの中で / MARON</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#1a1208;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1208}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;transform-origin:top left;
  font-family:"Noto Sans JP",system-ui,sans-serif;background:#1a1208}
#world{position:absolute;inset:0;transform-origin:50% 54%}
/* room / window background */
#room{position:absolute;inset:0;background:
  radial-gradient(60% 45% at 50% 56%, rgba(255,200,120,.28), transparent 64%),
  linear-gradient(180deg,#141a30 0%,#1d2340 34%,#2a2238 58%,#3a2a1c 82%,#241708 100%)}
#window{position:absolute;right:0;top:60px;width:560px;height:760px;overflow:hidden;opacity:.7;
  -webkit-mask:radial-gradient(120% 90% at 70% 30%,#000 40%,transparent 85%);mask:radial-gradient(120% 90% at 70% 30%,#000 40%,transparent 85%);
  background:linear-gradient(180deg,#0e1430 0%,#1a2448 60%,#2a3356 100%)}
.tlight{position:absolute;border-radius:50%;filter:blur(3px)}
/* christmas tree (left) */
#tree{position:absolute;left:-40px;top:120px;width:360px;height:900px}
.tier{position:absolute;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#2f6b3e,#1c4528);
  clip-path:polygon(50% 0,100% 100%,0 100%)}
.bauble{position:absolute;width:20px;height:20px;border-radius:50%;box-shadow:0 0 10px 2px rgba(255,120,90,.5)}
.tdot{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle,#fff2c0,#ffb84a);box-shadow:0 0 12px 3px rgba(255,190,90,.8)}
#tstar{position:absolute;left:50%;top:60px;transform:translateX(-50%);width:54px;height:54px;
  background:radial-gradient(circle,#fff5cf,#ffcf5a);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  box-shadow:0 0 30px 10px rgba(255,210,120,.8)}
/* snow globe */
#globe{position:absolute;left:50%;top:560px;transform:translateX(-50%);width:620px;height:620px;z-index:4}
#glass{position:absolute;inset:0;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 42% 34%, rgba(210,230,255,.30), rgba(150,180,230,.12) 50%, rgba(80,110,170,.18) 100%);
  box-shadow:0 20px 60px rgba(0,0,0,.5), inset 0 0 60px rgba(180,210,255,.25)}
#scene{position:absolute;inset:0;border-radius:50%;overflow:hidden}
#sky-in{position:absolute;inset:0;background:radial-gradient(circle at 50% 30%, #24345e 0%, #1a2748 60%, #121d38 100%)}
#ground{position:absolute;left:-5%;right:-5%;bottom:0;height:46%;background:radial-gradient(60% 120% at 50% 20%, #ffffff, #e6eeff 70%);
  border-radius:50% 50% 0 0/80% 80% 0 0}
.ftree{position:absolute;bottom:0;background:linear-gradient(180deg,#2f6b42,#1b4128);clip-path:polygon(50% 0,82% 46%,66% 46%,92% 100%,8% 100%,34% 46%,18% 46%)}
.fsnow-cap{position:absolute;background:rgba(240,246,255,.9);clip-path:polygon(50% 0,70% 42%,30% 42%);filter:blur(.4px)}
#house{position:absolute;left:120px;bottom:130px;width:120px;height:90px;background:linear-gradient(180deg,#7a4a30,#5a3320);border-radius:3px}
#house .roof{position:absolute;left:-10px;top:-38px;width:140px;height:46px;background:#b23a2e;clip-path:polygon(50% 0,100% 100%,0 100%)}
#house .roofsnow{position:absolute;left:-6px;top:-40px;width:132px;height:30px;background:rgba(240,246,255,.92);clip-path:polygon(50% 0,92% 72%,8% 72%)}
#house .win{position:absolute;top:30px;width:22px;height:26px;background:radial-gradient(circle,#fff0bf,#ffb84a);box-shadow:0 0 10px rgba(255,190,90,.8)}
#church{position:absolute;left:300px;bottom:150px;width:70px;height:120px;background:linear-gradient(180deg,#6a6f88,#454a63)}
#church .spire{position:absolute;left:50%;top:-80px;transform:translateX(-50%);width:34px;height:90px;background:#5a5f78;clip-path:polygon(50% 0,100% 100%,0 100%)}
#church .cw{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:20px;height:28px;background:radial-gradient(circle,#fff0bf,#ffb84a);box-shadow:0 0 8px rgba(255,190,90,.8)}
#stream{position:absolute;left:40%;bottom:60px;width:180px;height:50px;background:radial-gradient(circle,#8fc0e6,#4f86b8);border-radius:50%;filter:blur(2px);opacity:.8}
#bridge{position:absolute;left:46%;bottom:70px;width:110px;height:34px;border:7px solid #caa; border-color:#c9b48c;border-bottom:none;border-radius:60px 60px 0 0;background:transparent}
#lamp-in{position:absolute;left:250px;bottom:120px;width:6px;height:70px;background:#2a2016}
#lamp-in::after{content:"";position:absolute;left:-7px;top:-10px;width:20px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff2c0,#ffb84a);box-shadow:0 0 16px 4px rgba(255,190,90,.9)}
.insnow{position:absolute;border-radius:50%;background:#ffffff;z-index:5}
#spark-in{position:absolute;inset:0;z-index:6}
.spk{position:absolute;border-radius:50%;background:radial-gradient(circle,#ffffff,transparent 70%)}
#highlight{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:7;
  background:radial-gradient(40% 30% at 32% 24%, rgba(255,255,255,.55), transparent 60%),
             radial-gradient(14% 10% at 72% 78%, rgba(255,255,255,.25), transparent 70%)}
#rimlight{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:7;box-shadow:inset 0 0 40px rgba(255,255,255,.25), inset 8px 8px 30px rgba(255,255,255,.2)}
/* base (music box) */
#base{position:absolute;left:50%;top:1140px;transform:translateX(-50%);width:460px;height:170px;z-index:3;
  background:linear-gradient(180deg,#6a4423 0%,#4a2e16 50%,#331f0e 100%);border-radius:16px 16px 22px 22px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
#baseband{position:absolute;left:50%;top:1176px;transform:translateX(-50%);width:430px;height:60px;z-index:3;display:flex;align-items:center;justify-content:space-around;opacity:.9}
.flake{width:30px;height:30px;color:#d9b36a;font-size:30px;line-height:1}
#basetop{position:absolute;left:50%;top:1132px;transform:translateX(-50%);width:420px;height:26px;z-index:3;border-radius:50%;background:radial-gradient(circle at 50% 30%,#7a5230,#3a2410)}
/* surround props */
#gift{position:absolute;left:40px;bottom:120px;width:150px;height:120px;z-index:5;background:linear-gradient(180deg,#c13a34,#8e2420);border-radius:6px;box-shadow:0 10px 24px rgba(0,0,0,.5)}
#gift::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:20px;transform:translateX(-50%);background:linear-gradient(180deg,#f0c75a,#caa23e)}
#gift::after{content:"";position:absolute;left:0;right:0;top:40%;height:20px;background:linear-gradient(90deg,#f0c75a,#caa23e)}
#bow{position:absolute;left:92px;bottom:230px;width:60px;height:34px;z-index:5;border-radius:50%;
  background:radial-gradient(circle at 30% 50%,#f0c75a,#caa23e),radial-gradient(circle at 70% 50%,#f0c75a,#caa23e)}
#lantern{position:absolute;right:50px;bottom:150px;width:120px;height:230px;z-index:5}
#lanbody{position:absolute;left:18px;top:60px;width:84px;height:130px;border-radius:12px;border:4px solid #4a3620;
  background:linear-gradient(180deg,rgba(255,210,140,.45),rgba(150,100,50,.55));box-shadow:0 0 56px 18px rgba(255,180,90,.6),inset 0 0 22px rgba(255,200,120,.6)}
#lanflame{position:absolute;left:52px;top:100px;width:18px;height:34px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 50% 70%,#fff3c4,#ffb43a 60%,#ff7a1e);box-shadow:0 0 24px 8px rgba(255,160,60,.8)}
#lantop{position:absolute;left:30px;top:30px;width:60px;height:34px;background:#3a2a18;border-radius:8px 8px 0 0}
.pine{position:absolute;border-radius:40% 50% 45% 50%;background:radial-gradient(circle,#8a6a3a,#4a3418)}
.berry{position:absolute;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#e8554a,#9e2820);box-shadow:0 0 6px rgba(230,80,70,.5)}
#orn-house{position:absolute;right:70px;bottom:120px;width:70px;height:70px;background:#efe7d6;border-radius:4px;z-index:5}
#orn-house .r{position:absolute;left:-8px;top:-24px;width:86px;height:30px;background:#efe7d6;clip-path:polygon(50% 0,100% 100%,0 100%)}
#orn-house .w{position:absolute;top:30px;left:24px;width:22px;height:26px;background:radial-gradient(circle,#fff0bf,#ffb84a);box-shadow:0 0 10px rgba(255,190,90,.8)}
/* outer snow + bokeh */
.osnow{position:absolute;border-radius:50%;background:rgba(245,250,255,.95)}
.bok{position:absolute;border-radius:50%;filter:blur(5px)}
/* text */
#scenes{position:absolute;left:60px;right:60px;top:1380px;height:420px;z-index:9}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;will-change:opacity,transform}
#titlewrap{position:absolute;left:0;right:0;top:120px;text-align:center;z-index:9;opacity:0}
.title-jp{font-family:"Noto Serif JP",serif;font-size:80px;font-weight:600;letter-spacing:4px;
  background:linear-gradient(92deg,#ffffff,#eaf2ff 50%,#cfe0ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 14px rgba(0,0,0,.6)) drop-shadow(0 0 26px rgba(180,210,255,.5))}
.artist-top{font-family:"Noto Serif JP",serif;font-size:36px;letter-spacing:12px;color:#eadfca;margin-top:8px}
.lyr{font-family:"Noto Serif JP",serif;font-size:58px;font-weight:600;line-height:1.4;letter-spacing:1px;color:#fdf8ee;
  text-shadow:0 3px 20px rgba(0,0,0,.8),0 0 22px rgba(255,210,140,.3)}
.lyr .hl{color:#ffe0a0} .lyr .xmas{color:#ff8f7a}
.lyr .en{display:block;font-family:"Noto Sans JP";font-size:33px;font-weight:600;color:#ecd6ae;letter-spacing:1px;margin-top:12px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.badge{display:inline-block;font-family:"Noto Sans JP";font-size:27px;font-weight:800;letter-spacing:4px;color:#7a1d16;
  background:linear-gradient(90deg,#ffe6ad,#ffb6a0);padding:9px 24px;border-radius:40px;margin-bottom:18px}
.cta-t{font-family:"Noto Serif JP",serif;font-size:70px;font-weight:600;letter-spacing:3px;
  background:linear-gradient(92deg,#ffffff,#cfe0ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 16px rgba(0,0,0,.6))}
.cta-a{font-family:"Noto Serif JP",serif;font-size:40px;letter-spacing:10px;color:#f0e4cc;margin-top:10px}
.cta-s{font-size:30px;color:#e6d4b2;letter-spacing:2px;margin-top:16px}
#vig{position:absolute;inset:0;pointer-events:none;z-index:10;background:radial-gradient(130% 80% at 50% 48%,transparent 56%,rgba(0,0,0,.5) 100%)}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:20}
#play{width:150px;height:150px;border-radius:50%;border:none;cursor:pointer;color:#7a1d16;font-size:60px;background:linear-gradient(135deg,#ffe6ad,#ffb6a0);box-shadow:0 10px 40px rgba(0,0,0,.5)}
#bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.12);z-index:20}
#barf{height:100%;width:0;background:linear-gradient(90deg,#ffe6ad,#cfe0ff)}
body.capture #ui,body.capture #bar{display:none}
</style></head>
<body>

<div id="wrap"><div id="stage">
 <div id="world">
  <div id="room"></div>
  <div id="window"></div>
  <div id="tree"><div id="tstar"></div></div>
  <!-- globe -->
  <div id="globe">
    <div id="glass">
      <div id="scene">
        <div id="sky-in"></div>
        <div id="ground"></div>
        <div id="church"><div class="spire"></div><div class="cw"></div></div>
        <div id="house"><div class="roof"></div><div class="roofsnow"></div></div>
        <div id="stream"></div><div id="bridge"></div>
        <div id="lamp-in"></div>
        <div id="trees-in"></div>
        <div id="insnowf"></div>
        <div id="spark-in"></div>
      </div>
      <div id="rimlight"></div><div id="highlight"></div>
    </div>
  </div>
  <div id="basetop"></div><div id="base"></div><div id="baseband"></div>
  <!-- props -->
  <div id="gift"></div><div id="bow"></div>
  <div id="lantern"><div id="lantop"></div><div id="lanbody"></div><div id="lanflame"></div></div>
  <div id="orn-house"><div class="r"></div><div class="w"></div></div>
  <div id="snowf"></div>
  <div id="bokf"></div>
 </div>
 <div id="titlewrap"><div class="title-jp">スノーグローブの中で</div><div class="artist-top">MARON</div></div>
 <div id="scenes"></div>
 <div id="vig"></div>
 <div id="ui"><button id="play">&#9654;</button></div>
 <div id="bar"><div id="barf"></div></div>
</div></div>
<audio id="bgm" src="snowglobe-bgm.mp3" preload="auto"></audio>

<script>

const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform='scale('+s+')';
  document.getElementById('wrap').style.width=innerWidth+'px';}
addEventListener('resize',fit);fit();
const capture=new URLSearchParams(location.search).has('capture');
if(capture)document.body.classList.add('capture');
let _s=12252026;function rnd(){_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff;}

// window town bokeh
const win=document.getElementById('window');
for(let i=0;i<40;i++){const d=document.createElement('div');d.className='tlight';const sz=6+rnd()*16;
  d.style.width=sz+'px';d.style.height=sz+'px';d.style.left=(rnd()*560)+'px';d.style.top=(380+rnd()*360)+'px';
  d.style.background='radial-gradient(circle,'+(rnd()<0.7?'rgba(255,200,120,.8)':'rgba(170,200,255,.7)')+',transparent 70%)';win.appendChild(d);}

// christmas tree tiers + lights + baubles
const tree=document.getElementById('tree');const tdots=[];
[[160,330,120],[150,470,170],[130,620,220]].forEach(([w,top,h])=>{const t=document.createElement('div');t.className='tier';
  t.style.width=w*2.0+'px';t.style.height=h+'px';t.style.top=top+'px';tree.appendChild(t);});
for(let i=0;i<26;i++){const d=document.createElement('div');d.className='tdot';d.style.left=(60+rnd()*240)+'px';d.style.top=(340+rnd()*500)+'px';tree.appendChild(d);tdots.push({el:d,ph:rnd()*6.28,sp:1+rnd()*2.5});}
for(let i=0;i<10;i++){const b=document.createElement('div');b.className='bauble';b.style.left=(70+rnd()*220)+'px';b.style.top=(380+rnd()*440)+'px';
  b.style.background='radial-gradient(circle at 35% 30%,#ff7a6a,#b2271e)';if(rnd()<0.4)b.style.background='radial-gradient(circle at 35% 30%,#ffd86a,#c89a2e)';tree.appendChild(b);}

// globe inner fir trees
const tin=document.getElementById('trees-in');
[[70,150,210],[430,130,200],[180,90,150],[340,100,150]].forEach(([x,w,h])=>{const t=document.createElement('div');t.className='ftree';
  t.style.left=x+'px';t.style.width=w+'px';t.style.height=h+'px';t.style.bottom='120px';tin.appendChild(t);
  const c=document.createElement('div');c.className='fsnow-cap';c.style.left=x+'px';c.style.width=w+'px';c.style.height=h*0.5+'px';c.style.bottom=(120+h*0.5)+'px';tin.appendChild(c);});
// house windows
const house=document.getElementById('house');
[[20],[70]].forEach(([l])=>{const w=document.createElement('div');w.className='win';w.style.left=l+'px';house.appendChild(w);});
// inner snow
const insf=document.getElementById('insnowf');const insnow=[];
for(let i=0;i<70;i++){const s=document.createElement('div');s.className='insnow';const sz=3+rnd()*6;s.style.width=sz+'px';s.style.height=sz+'px';insf.appendChild(s);
  insnow.push({el:s,x:rnd()*620,y:rnd()*620,sp:14+rnd()*30,drift:14+rnd()*30,ph:rnd()*6.28});}
// inner sparkles
const spin=document.getElementById('spark-in');const sparks=[];
for(let i=0;i<26;i++){const s=document.createElement('div');s.className='spk';const sz=3+rnd()*8;s.style.width=sz+'px';s.style.height=sz+'px';
  s.style.left=(rnd()*620)+'px';s.style.top=(rnd()*500)+'px';spin.appendChild(s);sparks.push({el:s,ph:rnd()*6.28,sp:1.5+rnd()*3});}
// base snowflakes band
const band=document.getElementById('baseband');
for(let i=0;i<9;i++){const f=document.createElement('div');f.className='flake';f.innerHTML='&#10052;';band.appendChild(f);}
// props: pinecones, berries
const world=document.getElementById('world');
[[70,70,36,36],[150,60,28,28]].forEach(([x,y,w,h])=>{const p=document.createElement('div');p.className='pine';p.style.left=x+'px';p.style.bottom=y+'px';p.style.width=w+'px';p.style.height=h+'px';p.style.position='absolute';p.style.zIndex=5;world.appendChild(p);});
for(const [x,y] of [[60,250],[120,70],[190,90],[940,120]]){const b=document.createElement('div');b.className='berry';b.style.position='absolute';b.style.left=x+'px';b.style.bottom=y+'px';b.style.zIndex=5;world.appendChild(b);}
// outer snow
const snowf=document.getElementById('snowf');const osnow=[];
for(let i=0;i<70;i++){const s=document.createElement('div');s.className='osnow';const sz=3+rnd()*6;s.style.width=sz+'px';s.style.height=sz+'px';snowf.appendChild(s);
  osnow.push({el:s,x:rnd()*1080,y:rnd()*1920,sp:20+rnd()*34,drift:16+rnd()*34,ph:rnd()*6.28});}
// bokeh
const bokf=document.getElementById('bokf');const boks=[];
for(let i=0;i<16;i++){const b=document.createElement('div');b.className='bok';const sz=14+rnd()*40;b.style.width=sz+'px';b.style.height=sz+'px';
  b.style.left=(rnd()*1080)+'px';b.style.top=(rnd()*1500)+'px';b.style.background='radial-gradient(circle,'+(rnd()<0.7?'rgba(255,200,120,.5)':'rgba(255,120,100,.4)')+',transparent 70%)';bokf.appendChild(b);boks.push({el:b,ph:rnd()*6.28,sp:0.4+rnd()*1.2});}

const globe=document.getElementById('globe'),lanflame=document.getElementById('lanflame'),
  titlewrap=document.getElementById('titlewrap');

// scenes (BGM 3:00 start; final chorus swell ~ +4s). 最終サビ(みんなの/世界中の)
const scenes=[
 {s:3000, e:7200,  html:'<div class="sc"><div class="lyr"><span class="hl">スノーグローブの中で</span><span class="en">Inside the snow globe</span></div></div>'},
 {s:7200, e:11000, html:'<div class="sc"><div class="lyr">みんなの雪が舞う</div></div>'},
 {s:11000,e:15000, html:'<div class="sc"><div class="lyr">離れていても<br>同じ空に</div></div>'},
 {s:15000,e:19200, html:'<div class="sc"><div class="lyr">ベルが鳴る<br><span class="xmas">Merry Christmas</span></div></div>'},
 {s:19200,e:23200, html:'<div class="sc"><div class="lyr"><span class="hl">くるり 回せば<br>会いにゆける</span><span class="en">Give it a turn, and I can come to you</span></div></div>'},
 {s:23200,e:27000, html:'<div class="sc"><div class="lyr">世界中の 窓のひへ<span class="en">to the lit windows of the whole world</span></div></div>'},
 {s:27000,e:31000, html:'<div class="sc"><span class="badge">NEW SINGLE</span><div class="cta-t">スノーグローブの中で</div><div class="cta-a">MARON</div><div class="cta-s">配信中 &nbsp;/&nbsp; Merry Christmas</div></div>'},
];
const scEls=[];const marks=[];const scenesEl=document.getElementById('scenes');
scenes.forEach(sc=>{const w=document.createElement('div');w.innerHTML=sc.html;const el=w.firstElementChild;
  scenesEl.appendChild(el);scEls.push(el);marks.push({start:sc.s,end:sc.e});});
const TOTAL=31000;window.TOTAL=TOTAL;
function smooth(t,a,b){if(t<=a)return 0;if(t>=b)return 1;const x=(t-a)/(b-a);return x*x*(3-2*x);}

window.renderAt=function(t){
  const ts=t/1000,prog=t/TOTAL;
  // gentle swirl boost around "くるり回せば" (scene idx4: 19.2-23.2s)
  const swirl=smooth(t,18500,20500)*(1-smooth(t,22500,24500));
  // tree lights twinkle
  for(const d of tdots)d.el.style.opacity=(0.5+0.5*Math.sin(ts*d.sp+d.ph)).toFixed(3);
  // window bokeh gentle
  for(const b of boks){b.el.style.opacity=(0.4+0.4*Math.sin(ts*b.sp+b.ph)).toFixed(3);b.el.style.transform='translateY('+(Math.sin(ts*0.3+b.ph)*8).toFixed(1)+'px)';}
  // inner snow falls + swirl on cue
  for(const s of insnow){let y=(s.y+ts*s.sp*(1+1.6*swirl))%620;
    const xx=s.x+Math.sin(ts*0.9+s.ph)*(s.drift*(1+2*swirl));
    s.el.style.transform='translate('+(xx%620).toFixed(1)+'px,'+y.toFixed(1)+'px)';s.el.style.opacity='0.95';}
  // inner sparkles twinkle
  for(const s of sparks)s.el.style.opacity=(0.2+0.7*Math.abs(Math.sin(ts*s.sp+s.ph))).toFixed(3);
  // globe gentle bob + tiny tilt on swirl
  globe.style.transform='translateX(-50%) translateY('+(Math.sin(ts*0.8)*5).toFixed(1)+'px) rotate('+(Math.sin(ts*2.2)*1.2*swirl).toFixed(2)+'deg)';
  // lantern flame
  const fk=Math.sin(ts*12)*0.5+Math.sin(ts*27+1)*0.3;lanflame.style.transform='translateX('+(fk*2).toFixed(2)+'px) scaleY('+(1+fk*0.14).toFixed(3)+')';lanflame.style.opacity=(0.9+0.1*fk).toFixed(3);
  // outer snow
  for(const s of osnow){let y=(s.y+ts*s.sp)%1960;const xx=s.x+Math.sin(ts*0.5+s.ph)*s.drift;
    s.el.style.transform='translate('+xx.toFixed(1)+'px,'+y.toFixed(1)+'px)';s.el.style.opacity=(0.5+0.4*Math.sin(ts*0.9+s.ph)).toFixed(3);}
  // world subtle breathe
  document.getElementById('world').style.transform='scale('+(1+0.02*Math.sin(ts*0.5)+0.02*prog).toFixed(4)+')';
  // title (shows first ~ with the globe, fades before CTA)
  titlewrap.style.opacity=Math.max(0,Math.min(smooth(t,400,1400),1-smooth(t,26400,27000))).toFixed(3);
  // scenes (fade strictly within each scene's own [start,end] -> no overlap/double-exposure)
  const FADE=260;
  for(let i=0;i<scEls.length;i++){const m=marks[i];
    const o=smooth(t,m.start,m.start+FADE)*(1-smooth(t,m.end-FADE,m.end));
    scEls[i].style.opacity=o.toFixed(3);scEls[i].style.transform='translateY('+(14*(1-o)).toFixed(1)+'px)';}
};

const bgm=document.getElementById('bgm');const barf=document.getElementById('barf');let t0=0;
function play(){document.getElementById('ui').style.display='none';
  try{bgm.currentTime=0;bgm.play();}catch(e){}
  t0=performance.now();
  (function loop(){const t=performance.now()-t0;const tt=Math.min(t,TOTAL);window.renderAt(tt);
    barf.style.width=(100*tt/TOTAL)+'%';if(t<TOTAL)requestAnimationFrame(loop);})();
  setTimeout(()=>{const st=performance.now();(function fo(){const k=(performance.now()-st)/1600;
    bgm.volume=Math.max(0,0.92*(1-k));if(k<1)requestAnimationFrame(fo);else bgm.pause();})();},TOTAL-1600);
}
document.getElementById('play').addEventListener('click',play);
window.renderAt(0);

</script>
