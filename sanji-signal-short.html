<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>三時三十四分 -Signal- (Promo Short)</title>
<meta name="description" content="午前3時34分、眠らない部屋から。新曲「三時三十四分 -Signal-」。">
<meta property="og:title" content="三時三十四分 -Signal- (Promo Short)">
<meta property="og:description" content="午前3時34分、眠らない部屋から。新曲「三時三十四分 -Signal-」。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600&family=Noto+Sans+JP:wght@600&display=swap">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#060b18;overflow:hidden}
  body{font-family:'Noto Serif JP','Hiragino Mincho ProN',serif;color:#e9dcae;
    display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1080px;height:1920px;flex:none;transform:scale(var(--s,0.4));transform-origin:center center;
    overflow:hidden;background:#0a1220}
  #room{position:absolute;inset:0;background:linear-gradient(160deg,#0c1832 0%,#0a1428 46%,#0b1220 74%,#080d18 100%)}
  /* window */
  #win{position:absolute;left:210px;top:300px;width:660px;height:820px;background:#0c1c3a;overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.6), inset 0 0 60px rgba(0,0,0,.5)}
  #wsky{position:absolute;left:0;top:0;width:100%;height:44%;background:linear-gradient(#0c1f44,#16305e 70%,#294f7e)}
  .cloud{position:absolute;height:40px;border-radius:40px;background:#2b466e;opacity:.4;filter:blur(6px)}
  .wstar{position:absolute;width:2px;height:2px;border-radius:50%;background:#cfe0ff;opacity:0}
  #wcity{position:absolute;left:0;top:36%;width:100%;height:44%;background:linear-gradient(#0a1730,#0a1226);
    clip-path:polygon(0 40%,5% 40%,5% 24%,9% 24%,9% 44%,13% 44%,13% 14%,16% 14%,16% 38%,21% 38%,21% 26%,26% 26%,26% 48%,31% 48%,31% 18%,35% 18%,35% 40%,40% 40%,40% 28%,44% 28%,44% 46%,49% 46%,49% 20%,53% 20%,53% 42%,58% 42%,58% 12%,61% 12%,61% 40%,66% 40%,66% 30%,71% 30%,71% 46%,76% 46%,76% 22%,80% 22%,80% 42%,85% 42%,85% 32%,89% 32%,89% 46%,94% 46%,94% 26%,98% 26%,98% 44%,100% 44%,100% 100%,0 100%)}
  .wlight{position:absolute;width:4px;height:5px;background:#ffce7f;opacity:0;border-radius:1px}
  #aircraft{position:absolute;left:58%;top:16%;width:6px;height:6px;border-radius:50%;background:#ff5a5a;
    box-shadow:0 0 10px 3px rgba(255,60,60,.7);opacity:0}
  #road{position:absolute;left:0;bottom:0;width:100%;height:22%;
    background:linear-gradient(#0a1428, #10182a);overflow:hidden}
  .trail{position:absolute;height:6px;border-radius:4px;filter:blur(2px)}
  #mullionV{position:absolute;left:66%;top:0;width:14px;height:100%;background:#0a1120;opacity:.9}
  #mullionH{position:absolute;left:0;top:52%;width:100%;height:12px;background:#0a1120;opacity:.85}
  #winframe{position:absolute;left:210px;top:300px;width:660px;height:820px;border:16px solid #0b1220;
    box-shadow:inset 0 0 40px rgba(0,0,0,.7);pointer-events:none}
  #winglass{position:absolute;left:226px;top:316px;width:628px;height:788px;pointer-events:none;
    background:linear-gradient(120deg, rgba(90,140,210,.06), transparent 40%)}
  /* wall notes (left) */
  .note{position:absolute;width:70px;height:64px;background:#d8c98a;opacity:.5;transform:rotate(-4deg);box-shadow:0 4px 8px rgba(0,0,0,.4)}
  .photo{position:absolute;width:74px;height:54px;background:#22304a;border:3px solid #cdbf9a;opacity:.45;transform:rotate(3deg)}
  /* desk */
  #desk{position:absolute;left:0;bottom:0;width:100%;height:38%;
    background:linear-gradient(#0d1526 0%, #0a1120 60%, #070c16 100%)}
  #lampglow{position:absolute;left:60px;top:1130px;width:640px;height:620px;
    background:radial-gradient(circle at 30% 30%, rgba(255,180,90,.5), rgba(255,150,70,.14) 40%, transparent 66%);filter:blur(2px)}
  #lampshade{position:absolute;left:120px;top:1090px;width:150px;height:90px;background:#0b1018;
    border-radius:50% 50% 12px 12px;transform:rotate(28deg);box-shadow:0 8px 20px rgba(0,0,0,.5)}
  #lampbulb{position:absolute;left:196px;top:1156px;width:36px;height:36px;border-radius:50%;
    background:radial-gradient(circle,#fff2cc,#ffb14e 60%,transparent 72%);box-shadow:0 0 40px 16px rgba(255,170,80,.6)}
  #lamparm{position:absolute;left:150px;top:1180px;width:8px;height:340px;background:#0b1018;transform:rotate(12deg);transform-origin:bottom}
  #laptop{position:absolute;left:120px;top:1360px;width:300px;height:200px}
  #lscreen{position:absolute;left:20px;top:0;width:270px;height:172px;transform:perspective(500px) rotateY(20deg);
    background:linear-gradient(150deg,#0f2f52,#123f6e);border:4px solid #0a121e;box-shadow:0 0 30px rgba(70,150,230,.4);overflow:hidden}
  #lscreen .wv{position:absolute;left:0;bottom:30%;width:100%;height:3px;background:#6fc9ff;box-shadow:0 0 8px #6fc9ff}
  #lbase{position:absolute;left:0;top:168px;width:300px;height:26px;background:#0c1420;
    transform:perspective(500px) rotateX(52deg);transform-origin:top;border-radius:0 0 8px 8px}
  #clock{position:absolute;left:470px;top:1420px;width:220px;height:110px;background:#05080f;border:3px solid #10202f;
    border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(80,210,220,.25)}
  #clock .t{font-family:'DS-Digital','Courier New',monospace;font-weight:700;font-size:78px;letter-spacing:.06em;
    color:#5fe0ea;text-shadow:0 0 16px rgba(95,224,234,.85)}
  #clock .c{transition:opacity .1s}
  #mug{position:absolute;left:740px;top:1470px;width:90px;height:84px;background:#1a2436;border-radius:8px 8px 12px 12px;
    box-shadow:inset 0 6px 10px rgba(255,180,100,.15)}
  #mug::after{content:"";position:absolute;right:-22px;top:18px;width:26px;height:36px;border:7px solid #1a2436;border-left:none;border-radius:0 20px 20px 0}
  .steam{position:absolute;left:770px;width:5px;height:80px;background:linear-gradient(to top, rgba(255,230,200,.0), rgba(255,230,200,.5), rgba(255,230,200,0));
    border-radius:3px;filter:blur(2px);opacity:0}
  .paper{position:absolute;background:#c9c3ac;opacity:.5;box-shadow:0 3px 8px rgba(0,0,0,.4)}
  #amp{position:absolute;right:40px;top:1470px;width:170px;height:250px;background:#0a0f18;border:3px solid #141c28;border-radius:8px}
  #amp::before{content:"";position:absolute;left:20px;top:20px;right:20px;height:120px;border-radius:6px;
    background:repeating-linear-gradient(45deg,#121926 0 4px,#0d131e 4px 8px)}
  #dust{position:absolute;inset:0;pointer-events:none}
  .mote{position:absolute;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle,#ffe6b8,#e0a24a 60%,transparent 70%);opacity:0}
  #grain{position:absolute;inset:0;opacity:.10;pointer-events:none;mix-blend-mode:overlay;
    background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:3px 3px}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 42% 56%, transparent 46%, rgba(3,6,14,.8) 100%)}
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    text-align:center;padding:96px 90px 0;opacity:0;z-index:6}
  .scene.mid{justify-content:center;padding-top:0}
  .kick{font-family:'Noto Sans JP',system-ui,sans-serif;font-size:30px;letter-spacing:.5em;color:#c7b98a;font-weight:600;
    text-transform:uppercase;margin-bottom:24px}
  .title{font-size:132px;line-height:1.0;font-weight:600;color:#eaddb0;letter-spacing:.08em;
    text-shadow:0 2px 30px rgba(0,0,0,.7)}
  .sig{display:flex;align-items:center;justify-content:center;gap:24px;margin-top:24px;color:#d7e2f2}
  .sig i{display:block;width:120px;height:2px;background:linear-gradient(90deg,transparent,#9fb6d8,transparent)}
  .sig b{font-family:Georgia,serif;font-weight:400;font-size:62px;letter-spacing:.28em}
  .led{font-family:'Courier New',monospace;font-weight:700;font-size:240px;letter-spacing:.08em;color:#5fe0ea;
    text-shadow:0 0 40px rgba(95,224,234,.8),0 0 90px rgba(95,224,234,.4)}
  .tag{margin-top:30px;font-family:'Noto Sans JP',system-ui,sans-serif;font-size:30px;letter-spacing:.44em;color:#c7b98a;text-transform:uppercase}
  #bar{position:absolute;left:0;bottom:0;height:7px;width:0;background:linear-gradient(90deg,#5fe0ea,#e8a24a);opacity:.85;z-index:9}
  #ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(6,11,24,.86);backdrop-filter:blur(4px);z-index:20;gap:32px;padding:0 90px;text-align:center}
  #ui .k{font-family:'Noto Sans JP',system-ui,sans-serif;font-size:28px;letter-spacing:.44em;color:#5fe0ea;text-transform:uppercase}
  #ui h1{font-size:104px;font-weight:600;color:#eaddb0;line-height:1.05;letter-spacing:.06em}
  #ui p{font-family:Georgia,serif;font-size:42px;letter-spacing:.3em;color:#aab8d8}
  #play{font-family:'Noto Sans JP',system-ui,sans-serif;font-size:40px;font-weight:700;color:#06111f;background:#5fe0ea;border:none;
    border-radius:100px;padding:28px 78px;cursor:pointer;letter-spacing:.12em;box-shadow:0 10px 40px rgba(95,224,234,.4)}
  #play:hover{background:#8aeaf1}
  #ui.hide{opacity:0;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="room"></div>
  <div class="note" style="left:40px;top:760px"></div>
  <div class="note" style="left:56px;top:900px;transform:rotate(3deg)"></div>
  <div class="photo" style="left:120px;top:700px"></div>
  <div id="win">
    <div id="wsky"></div>
    <div id="aircraft"></div>
    <div id="wcity"></div>
    <div id="road"></div>
    <div id="mullionV"></div>
    <div id="mullionH"></div>
  </div>
  <div id="winglass"></div>
  <div id="winframe"></div>
  <div id="desk"></div>
  <div id="lampglow"></div>
  <div id="lamparm"></div>
  <div id="lampshade"></div>
  <div id="lampbulb"></div>
  <div id="amp"></div>
  <div class="paper" style="left:430px;top:1560px;width:210px;height:120px;transform:rotate(-5deg)"></div>
  <div class="paper" style="left:470px;top:1600px;width:200px;height:110px;transform:rotate(6deg)"></div>
  <div id="laptop"><div id="lscreen"><div class="wv"></div></div><div id="lbase"></div></div>
  <div id="clock"><div class="t">03<span class="c" id="clockcolon">:</span>34</div></div>
  <div id="mug"></div>
  <div id="dust"></div>
  <div id="grain"></div>
  <div id="scenes"></div>
  <div id="vig"></div>
  <div id="bar"></div>
  <div id="ui">
    <div class="k">Signal</div>
    <h1>三時三十四分</h1>
    <p>Signal</p>
    <button id="play">&#9654; Play</button>
  </div>
</div></div>
<audio id="bgm" src="sanji-signal-bgm.mp3" preload="auto"></audio>
<script>
  function fit(){const s=Math.min(window.innerWidth/1080,window.innerHeight/1920);
    document.getElementById('stage').style.setProperty('--s',s);}
  window.addEventListener('resize',fit);fit();
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), frac=v=>v-Math.floor(v);
  const win=document.getElementById('win'), wcity=document.getElementById('wcity'),
        wsky=document.getElementById('wsky'), road=document.getElementById('road');
  // window stars
  const WST=[]; for(let i=0;i<40;i++){const e=document.createElement('div');e.className='wstar';
    e.style.left=((i*53)%100)+'%';e.style.top=((i*31)%40)+'%';e.dataset.ph=((i*17)%100)/100;wsky.appendChild(e);WST.push(e);}
  // window city lights
  const WLI=[]; for(let i=0;i<70;i++){const e=document.createElement('div');e.className='wlight';
    e.style.left=((i*37)%100)+'%';e.style.top=(10+(i*53)%78)+'%';e.dataset.ph=((i*29)%100)/100;
    if(i%9===0){e.style.background='#ff6a6a';}else if(i%7===0){e.style.background='#59c6ff';}wcity.appendChild(e);WLI.push(e);}
  // car trails on road
  const TR=[]; const trailDefs=[
    {y:30,w:120,dir:1,col:'#fff2c8',spd:0.5,ph:0.0},{y:52,w:90,dir:1,col:'#8fd4ff',spd:0.36,ph:0.4},
    {y:64,w:150,dir:-1,col:'#ff4a52',spd:0.44,ph:0.7},{y:80,w:110,dir:-1,col:'#ff5e64',spd:0.3,ph:0.15}];
  trailDefs.forEach(d=>{const e=document.createElement('div');e.className='trail';e.style.top=d.y+'%';e.style.width=d.w+'px';
    e.style.background=`linear-gradient(90deg, transparent, ${d.col}, transparent)`;e.style.boxShadow=`0 0 12px ${d.col}`;
    road.appendChild(e);TR.push({e,...d});});
  // clouds
  const CL=[]; [['20%','8%',260],['58%','2%',300],['36%','20%',200]].forEach((c,i)=>{const e=document.createElement('div');
    e.className='cloud';e.style.left=c[0];e.style.top=c[1];e.style.width=c[2]+'px';wsky.appendChild(e);CL.push({e,i});});
  // dust motes (lamp)
  const dC=document.getElementById('dust'), MO=[];
  for(let i=0;i<18;i++){const x=90+((i*61)%620),dur=7+((i*53)%50)/10,phase=((i*29)%100)/100;
    const e=document.createElement('div');e.className='mote';e.style.left=x+'px';dC.appendChild(e);MO.push({e,dur,phase});}
  // steam
  const STM=[]; [0,1].forEach(i=>{const e=document.createElement('div');e.className='steam';e.style.left=(768+i*14)+'px';
    document.getElementById('stage').appendChild(e);STM.push({e,ph:i*0.8});});
  const lampglow=document.getElementById('lampglow'),lampbulb=document.getElementById('lampbulb'),
        aircraft=document.getElementById('aircraft'),wv=document.querySelector('#lscreen .wv'),
        colon=document.getElementById('clockcolon'),bar=document.getElementById('bar');
  const scenes=[
    {d:5000, html:`<div class="scene"><div class="kick">New Single</div></div>`},
    {d:8200, html:`<div class="scene"><div class="title">三時三十四分</div><div class="sig"><i></i><b>Signal</b><i></i></div></div>`},
    {d:6400, html:`<div class="scene mid"><div class="led">03:34</div></div>`},
    {d:9000, html:`<div class="scene"><div class="title">三時三十四分</div><div class="sig"><i></i><b>Signal</b><i></i></div><div class="tag">New Single &nbsp;&#9654;</div></div>`}
  ];
  const total=scenes.reduce((a,s)=>a+s.d,0); window.TOTAL=total;
  const scenesEl=document.getElementById('scenes'); let t0=0; const S=[];
  scenes.forEach(sc=>{const w=document.createElement('div');w.innerHTML=sc.html;const el=w.firstElementChild;
    el.style.opacity=0;scenesEl.appendChild(el);S.push({el,start:t0,end:t0+sc.d});t0+=sc.d;});
  function op(t,st,en){if(t<st||t>en)return 0;return clamp(Math.min((t-st)/820,(en-t)/560),0,1);}
  function flick(ts){return 0.9+0.1*(0.6*Math.sin(ts*8.1)+0.4*Math.sin(ts*15+1));}
  window.renderAt=function(t){
    const ts=t/1000, fl=flick(ts);
    lampglow.style.opacity=(0.85*fl).toFixed(3); lampbulb.style.opacity=fl.toFixed(3);
    for(const e of WST){const ph=+e.dataset.ph;e.style.opacity=(0.3+0.6*(0.5+0.5*Math.sin(ts*1.5+ph*6.28))).toFixed(2);}
    for(const e of WLI){const ph=+e.dataset.ph;e.style.opacity=(0.35+0.55*(0.5+0.5*Math.sin(ts*1.1+ph*6.28))).toFixed(2);}
    aircraft.style.opacity=(Math.sin(ts*3.1)>0.7?0.9:0.05).toFixed(2);
    for(const c of CL){c.e.style.transform=`translateX(${Math.sin(ts/10+c.i)*30+ts*3}px)`;}
    const RW=660;
    for(const tr of TR){let x=frac(ts*tr.spd+tr.ph)*(RW+240)-120; if(tr.dir<0)x=RW-x;
      tr.e.style.left=x+'px'; tr.e.style.opacity=(0.5+0.5*Math.sin(ts*3+tr.ph)).toFixed(2);}
    for(const m of MO){const prog=frac((ts)/m.dur+m.phase);
      m.e.style.top=(1760-prog*680)+'px';m.e.style.opacity=(Math.sin(prog*Math.PI)*0.6*fl).toFixed(2);}
    for(const s of STM){const prog=frac(ts/3.4+s.ph);
      s.e.style.top=(1470-prog*150)+'px';s.e.style.transform=`translateX(${Math.sin(prog*6.28+s.ph)*10}px) scaleY(${0.7+prog*0.6})`;
      s.e.style.opacity=(Math.sin(prog*Math.PI)*0.5).toFixed(2);}
    if(wv) wv.style.transform=`scaleY(${1+2.4*Math.abs(Math.sin(ts*6))})`;
    if(colon) colon.style.opacity=(Math.floor(ts*2)%2===0?1:0.15);
    for(const s of S){s.el.style.opacity=op(t,s.start,s.end);}
    if(bar) bar.style.width=(clamp(t/total,0,1)*100)+'%';
  };
  window.renderAt(0);
  const params=new URLSearchParams(location.search), ui=document.getElementById('ui');
  if(params.has('capture')){ ui.style.display='none'; bar.style.display='none'; }
  else {
    const bgm=document.getElementById('bgm');
    document.getElementById('play').addEventListener('click',()=>{
      ui.classList.add('hide');
      try{bgm.currentTime=0;bgm.volume=.85;bgm.play().catch(()=>{});}catch(e){}
      const start=performance.now();
      (function loop(){const t=performance.now()-start;window.renderAt(Math.min(t,total));
        if(t<total)requestAnimationFrame(loop);
        else{ui.classList.remove('hide');document.getElementById('play').textContent='↻ Replay';}})();
      setTimeout(()=>{const fs=performance.now();(function fo(){const k=(performance.now()-fs)/1500;
        bgm.volume=Math.max(0,.85*(1-k));if(k<1)requestAnimationFrame(fo);else bgm.pause();})();}, total-1500);
    });
  }
</script>
</body>
</html>
