<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wide Open / Rolling all stars (Lyric Short)</title>
<style>@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,600&family=Oswald:wght@600;700&family=Noto+Serif+JP:wght@500;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#0b0704;overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0704}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;transform-origin:top left;background:#0b0704;font-family:"EB Garamond","Noto Serif JP",serif}
#bgimg{position:absolute;left:-4%;top:-3%;width:108%;height:106%;object-fit:cover;will-change:transform}
#scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,5,2,.42),rgba(8,5,2,.12) 22%,rgba(8,5,2,.3) 52%,rgba(8,5,2,.72) 100%)}
#card{position:absolute;left:240px;top:150px;width:600px;height:600px;border-radius:26px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 2px rgba(255,220,150,.18);will-change:transform}
#cardimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ta{position:absolute;left:0;right:0;top:790px;text-align:center}
.ta-t{font-family:"EB Garamond","Noto Serif JP",serif;font-weight:600;font-style:italic;font-size:62px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.ta-a{font-family:"EB Garamond",serif;font-weight:500;font-size:34px;letter-spacing:9px;color:#ffd23d;margin-top:6px;text-shadow:0 2px 10px rgba(0,0,0,.7)}
#rays{position:absolute;left:540px;top:430px;width:1400px;height:1400px;transform:translate(-50%,-50%);z-index:3;pointer-events:none;mix-blend-mode:screen;opacity:.22;
  background:conic-gradient(from 0deg,rgba(255,228,170,0) 0deg,rgba(255,228,170,.14) 3deg,rgba(255,228,170,0) 8deg,rgba(255,228,170,0) 24deg,rgba(255,228,170,.12) 27deg,rgba(255,228,170,0) 32deg,rgba(255,228,170,0) 50deg,rgba(255,228,170,.13) 54deg,rgba(255,228,170,0) 59deg,rgba(255,228,170,0) 76deg,rgba(255,228,170,.11) 80deg,rgba(255,228,170,0) 85deg,rgba(255,228,170,0) 360deg)}
#parts{position:absolute;inset:0;z-index:4;pointer-events:none}
#lyric{position:absolute;left:70px;right:70px;top:1090px;height:470px;z-index:8;display:flex;align-items:center;justify-content:center;text-align:center}
#lyric .ln{position:absolute;left:0;right:0;font-family:"Oswald","EB Garamond",sans-serif;font-weight:600;font-size:80px;line-height:1.12;letter-spacing:1px;color:#fff;
  text-shadow:0 3px 3px rgba(0,0,0,.5),0 8px 30px rgba(0,0,0,.7);opacity:0;will-change:opacity,transform}
#lyric .ln.hook{color:#ffd23d;text-shadow:0 0 26px rgba(255,200,110,.55),0 3px 3px rgba(0,0,0,.5),0 8px 30px rgba(0,0,0,.7)}
#vig{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(130% 80% at 50% 44%,transparent 52%,rgba(8,4,2,.6) 100%)}
#ctadim{position:absolute;inset:0;z-index:11;background:rgba(10,6,2,0);pointer-events:none}
#cta{position:absolute;left:30px;right:30px;top:560px;text-align:center;z-index:12;opacity:0}
.badge{display:inline-block;font-family:"EB Garamond",serif;font-weight:600;font-size:32px;letter-spacing:7px;color:#2a1704;background:linear-gradient(90deg,#ffd23d,#ff7a2c);padding:9px 28px;border-radius:30px;margin-bottom:22px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.cta-t{font-family:"EB Garamond","Noto Serif JP",serif;font-weight:600;font-style:italic;font-size:104px;line-height:1.02;color:#fff;text-shadow:0 0 28px rgba(255,200,120,.6),0 5px 20px rgba(10,6,2,.7)}
.cta-a{font-family:"EB Garamond","Noto Serif JP",serif;font-weight:500;font-size:50px;letter-spacing:12px;color:#f3ead6;margin-top:14px;text-shadow:0 2px 12px rgba(10,6,2,.8)}
.cta-s{font-family:"EB Garamond","Noto Serif JP",serif;font-weight:600;font-size:40px;letter-spacing:3px;color:#ffd23d;margin-top:22px}
.cta-b{font-family:"EB Garamond",serif;font-weight:600;font-size:32px;letter-spacing:10px;color:#f3ead6;margin-top:12px;opacity:.92}
#logobug{position:absolute;left:46px;bottom:46px;width:124px;height:124px;border-radius:50%;overflow:hidden;z-index:13;box-shadow:0 0 0 3px rgba(255,220,150,.5),0 6px 16px rgba(0,0,0,.5);opacity:.95}
#logobug img{position:absolute;left:-14%;top:-10%;width:128%;height:128%;object-fit:cover}
#logotag{position:absolute;left:188px;bottom:70px;z-index:13;font-family:"EB Garamond",serif;font-weight:600;font-size:34px;letter-spacing:5px;color:#f7ecd6;opacity:.9;text-shadow:0 2px 8px rgba(0,0,0,.7)}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:30}
#play{width:150px;height:150px;border-radius:50%;border:none;cursor:pointer;color:#2a1704;font-size:60px;background:linear-gradient(135deg,#ffd23d,#ff7a2c);box-shadow:0 10px 40px rgba(0,0,0,.5)}
#bar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.14);z-index:30}
#barf{height:100%;width:0;background:linear-gradient(90deg,#ffd23d,#ff7a2c)}
body.capture #ui,body.capture #bar{display:none}
</style></head>
<body>

<div id="wrap"><div id="stage">
  <img id="bgimg" src="wideopen-lyric-bg.jpg">
  <div id="scrim"></div>
  <div id="rays"></div>
  <div id="parts"></div>
  <div id="card"><img id="cardimg" src="wideopen-jacket.jpg"></div>
  <div id="ta"><div class="ta-t">Wide Open</div><div class="ta-a">Rolling all stars</div></div>
  <div id="lyric"></div>
  <div id="vig"></div>
  <div id="ctadim"></div>
  <div id="cta"><span class="badge">NEW SONG</span><div class="cta-t">Wide Open</div><div class="cta-a">Rolling all stars</div><div class="cta-s">配信中 / Streaming Now</div><div class="cta-b">LEO MUSIC</div></div>
  <div id="logobug"><img src="leo-music-logo.png"></div><div id="logotag">LEO MUSIC</div>
  <div id="ui"><button id="play">&#9654;</button></div>
  <div id="bar"><div id="barf"></div></div>
</div></div>
<audio id="bgm" src="wideopen-bgm.mp3" preload="auto"></audio>

<script>

const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform='scale('+s+')';document.getElementById('wrap').style.width=innerWidth+'px';}
addEventListener('resize',fit);fit();
const capture=new URLSearchParams(location.search).has('capture');if(capture)document.body.classList.add('capture');
let _s=24601;function rnd(){_s=(_s*1103515245+12345)&0x7fffffff;return _s/0x7fffffff;}
// subtle ember particles
const parts=document.getElementById('parts');const items=[];
for(let i=0;i<46;i++){const sz=3+rnd()*7;const e=document.createElement('div');
  e.style.cssText='position:absolute;width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:radial-gradient(circle,rgba(255,210,130,.95),transparent 72%)';
  parts.appendChild(e);items.push({el:e,x:rnd()*1080,base:rnd()*2100,drift:10+rnd()*22,sway:20+rnd()*60,ph:rnd()*6.28,bl:0.6+rnd()*1.6,bp:rnd()*6.28});}
const CUES=[{"t": 1500, "x": "Wide open!"}, {"t": 4200, "x": "I'm holding it wide open"}, {"t": 7400, "x": "I left myself wide open"}, {"t": 10600, "x": "and the road came in"}, {"t": 13900, "x": "Wide open!"}, {"t": 17100, "x": "I'm holding it wide open"}, {"t": 20400, "x": "I left myself wide open"}, {"t": 23800, "x": "and the road came in"}];
const lyric=document.getElementById('lyric');const lns=[];
function isHook(t){const u=t.toUpperCase();return u.indexOf('WIDE OPEN')>=0||t===t.toUpperCase();}
for(const c of CUES){const d=document.createElement('div');d.className='ln'+(isHook(c.x)?' hook':'');d.textContent=c.x;lyric.appendChild(d);lns.push(d);}
const bgimg=document.getElementById('bgimg'),card=document.getElementById('card'),rays=document.getElementById('rays'),ta=document.getElementById('ta'),
  cta=document.getElementById('cta'),ctadim=document.getElementById('ctadim'),logobug=document.getElementById('logobug'),logotag=document.getElementById('logotag');
const BEAT=800.0, OFF=5; const CL_IN=4000, CL_PK=19000, CL_OUT=27000; const TOTAL=30000;window.TOTAL=TOTAL;
function smooth(t,a,b){if(t<=a)return 0;if(t>=b)return 1;const x=(t-a)/(b-a);return x*x*(3-2*x);}
window.renderAt=function(t){
  const ts=t/1000;const p=t/TOTAL;
  const bp=(((t-OFF)%BEAT)+BEAT)%BEAT/BEAT;const swell=0.5+0.5*Math.cos(bp*6.2832);
  const climax=smooth(t,CL_IN,CL_PK)*(1-0.5*smooth(t,CL_OUT,30000));
  card.style.transform='scale('+(1.0+0.05*p+0.012*swell).toFixed(4)+') translateY('+(-8*p).toFixed(1)+'px)';
  bgimg.style.transform='scale('+(1.05+0.06*p)+') translateY('+(-8*p)+'px)';
  rays.style.transform='translate(-50%,-50%) rotate('+(ts*2.0).toFixed(2)+'deg)';
  rays.style.opacity=(0.18+0.06*Math.sin(ts*0.5)+0.26*climax).toFixed(3);
  for(const it of items){const y=1980-((ts*it.drift+it.base)%2120);const x=it.x+Math.sin(ts*0.4+it.ph)*it.sway;
    const bl=0.4+0.6*Math.abs(Math.sin(ts*it.bl+it.bp));it.el.style.transform='translate('+x.toFixed(1)+'px,'+y.toFixed(1)+'px)';
    it.el.style.opacity=((0.25+0.4*climax)*bl).toFixed(3);}
  // lyric cue visibility
  for(let i=0;i<CUES.length;i++){const a=CUES[i].t;const b=(i+1<CUES.length)?CUES[i+1].t:25900;
    const inn=smooth(t,a,a+340);const out=1-smooth(t,b-220,b+120);let op=Math.max(0,Math.min(inn,out));
    // hide all lyrics once CTA begins
    op*=(1-smooth(t,25900,26600));
    const pulse=1+0.02*swell*(op>0.2?1:0);
    lns[i].style.opacity=op.toFixed(3);
    lns[i].style.transform='translateY('+((1-inn)*18).toFixed(1)+'px) scale('+pulse.toFixed(3)+')';}
  logobug.style.opacity=(0.9+0.06*Math.sin(ts*1.2)).toFixed(3);logotag.style.opacity=(0.82+0.06*Math.sin(ts*1.2)).toFixed(3);
  const endf=smooth(t,25900,26600);ta.style.opacity=(1-endf).toFixed(3);card.style.opacity=(1-endf).toFixed(3);
  const cvis=smooth(t,26400,27200);cta.style.opacity=cvis.toFixed(3);cta.style.transform='scale('+(0.98+0.02*cvis)+')';
  ctadim.style.background='rgba(10,6,2,'+(0.9*cvis).toFixed(3)+')';
};
const bgm=document.getElementById('bgm');const barf=document.getElementById('barf');let t0=0;
function play(){document.getElementById('ui').style.display='none';try{bgm.currentTime=0;bgm.play();}catch(e){}
  t0=performance.now();(function loop(){const t=performance.now()-t0;const tt=Math.min(t,TOTAL);window.renderAt(tt);barf.style.width=(100*tt/TOTAL)+'%';if(t<TOTAL)requestAnimationFrame(loop);})();
  setTimeout(()=>{const s0=performance.now();(function fo(){const k=(performance.now()-s0)/1500;bgm.volume=Math.max(0,0.95*(1-k));if(k<1)requestAnimationFrame(fo);else bgm.pause();})();},TOTAL-1500);}
document.getElementById('play').addEventListener('click',play);window.renderAt(0);

</script>
</body></html>
