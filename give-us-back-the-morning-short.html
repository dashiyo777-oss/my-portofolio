<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Common Table — Give Us Back the Morning (Promo Short)</title>
<meta name="description" content="The table belongs to everyone. The Common Table — 'Give Us Back the Morning'. We are more than they told us.">
<meta property="og:title" content="The Common Table — Give Us Back the Morning (Promo Short)">
<meta property="og:description" content="The table belongs to everyone. The Common Table — 'Give Us Back the Morning'. We are more than they told us.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Playfair+Display:wght@700;800&display=swap">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#0d0c0a;overflow:hidden}
  body{font-family:'Oswald','Arial Narrow','Helvetica Neue',system-ui,sans-serif;color:#1c2733;
    display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1080px;height:1920px;flex:none;transform:scale(var(--s,0.4));transform-origin:center center;
    overflow:hidden;background:#efe6d2;box-shadow:0 0 120px rgba(0,0,0,.6)}
  #paper{position:absolute;inset:0;background:linear-gradient(to bottom,#f4eeda 0%,#efe6d2 52%,#e7d9bd 78%,#d8c39c 100%)}
  #rays{position:absolute;left:76%;top:18%;width:1500px;height:1500px;transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg, rgba(232,178,63,.20) 0deg 7deg, transparent 7deg 20deg);
    -webkit-mask-image:radial-gradient(circle, #000 8%, rgba(0,0,0,.5) 30%, transparent 58%);
            mask-image:radial-gradient(circle, #000 8%, rgba(0,0,0,.5) 30%, transparent 58%)}
  #sun{position:absolute;left:76%;top:18%;transform:translate(-50%,-50%);width:270px;height:270px;border-radius:50%;
    background:radial-gradient(circle,#f4cf6a 0%,#e8b23f 58%,#dfa02f 72%,rgba(223,160,47,0) 76%)}
  .cloud{position:absolute;height:70px;border-radius:60px;background:#6f96ab;opacity:.5;filter:blur(1px)}
  #skyline{position:absolute;left:0;top:52%;width:100%;height:12%;
    background:linear-gradient(#3f6b86,#365a72);
    clip-path:polygon(0 60%,5% 60%,5% 38%,9% 38%,9% 64%,14% 64%,14% 30%,17% 30%,17% 58%,22% 58%,22% 44%,27% 44%,27% 66%,32% 66%,32% 26%,35% 26%,35% 56%,40% 56%,40% 40%,44% 40%,44% 64%,49% 64%,49% 32%,53% 32%,53% 60%,58% 60%,58% 22%,61% 22%,61% 58%,66% 58%,66% 42%,70% 42%,70% 64%,75% 64%,75% 34%,79% 34%,79% 58%,84% 58%,84% 46%,88% 46%,88% 64%,93% 64%,93% 36%,97% 36%,97% 60%,100% 60%,100% 100%,0 100%)}
  .torn{position:absolute;opacity:.62;box-shadow:2px 3px 0 rgba(0,0,0,.08);
    clip-path:polygon(2% 4%,98% 0,100% 92%,94% 100%,6% 97%,0 88%)}
  #daisy{position:absolute;left:118px;bottom:120px;width:120px;height:300px}
  #daisy .stem{position:absolute;left:50%;bottom:0;width:5px;height:210px;background:#5a7d4a;transform-origin:bottom center}
  #daisy .bloom{position:absolute;left:50%;top:0;width:120px;height:120px;transform:translateX(-50%)}
  #daisy .petal{position:absolute;left:50%;top:50%;width:20px;height:52px;border-radius:50%;background:#f3ecde;
    transform-origin:50% 0}
  #daisy .core{position:absolute;left:50%;top:50%;width:44px;height:44px;border-radius:50%;
    transform:translate(-50%,-50%);background:radial-gradient(circle,#e8b23f,#c98a2a)}
  #dust{position:absolute;inset:0;pointer-events:none}
  .mote{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff3d6;opacity:0;filter:blur(.4px)}
  #grain{position:absolute;inset:0;opacity:.12;pointer-events:none;mix-blend-mode:multiply;
    background-image:radial-gradient(circle,#3a2f22 1px,transparent 1px);background-size:3px 3px}
  #vig{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 92% at 50% 42%, transparent 56%, rgba(60,40,20,.34) 100%)}
  .scene{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 96px;opacity:0}
  .scene.top{justify-content:flex-start;padding-top:150px}
  /* newspaper clipping */
  .news{background:#e9e2cd;border:1px solid #cbbf9f;box-shadow:0 16px 40px rgba(0,0,0,.4);transform:rotate(-3deg);
    padding:40px 54px;max-width:840px;clip-path:polygon(1% 3%,99% 0,100% 96%,2% 100%,0 6%)}
  .news .eyebrow{font-family:'Oswald',system-ui,sans-serif;font-size:26px;letter-spacing:.42em;color:#b5402f;
    text-transform:uppercase;border-bottom:3px double #1c2733;padding-bottom:16px;margin-bottom:22px}
  .news .head{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:86px;line-height:1.02;color:#1c2733;
    text-transform:uppercase;letter-spacing:.005em}
  /* held placard */
  .placard{background:#e7ddc0;color:#1c2733;border:3px solid #c3b691;border-radius:4px;padding:44px 56px;
    box-shadow:0 16px 38px rgba(0,0,0,.42);transform:rotate(2deg);max-width:820px;font-weight:700;text-transform:uppercase}
  .placard .big{font-size:100px;line-height:1.0;display:block}
  .placard .md{font-size:66px;line-height:1.12;display:block}
  .placard .star{color:#b5402f;font-size:40px;margin-top:14px;display:block}
  /* title */
  .title{font-weight:700;font-size:132px;line-height:.9;letter-spacing:.005em;color:#1c2733;text-transform:uppercase;
    transform:scaleX(.92);text-shadow:0 2px 0 rgba(255,255,255,.3)}
  .rule{display:flex;align-items:center;justify-content:center;gap:20px;margin:24px 0 14px;color:#b5402f}
  .rule i{display:block;width:150px;height:4px;background:currentColor;opacity:.9}
  .rule b{font-size:34px}
  .redsub{font-weight:700;font-size:54px;letter-spacing:.24em;color:#b5402f;text-transform:uppercase}
  .reprise{font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:104px;line-height:1.06;color:#26313c;
    text-shadow:0 2px 0 rgba(255,255,255,.3)}
  .tag{margin-top:36px;font-size:30px;letter-spacing:.44em;color:#5a5138;text-transform:uppercase}
  #bar{position:absolute;left:0;bottom:0;height:7px;width:0;background:linear-gradient(90deg,#b5402f,#e8b23f);opacity:.9;z-index:8}
  #ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(20,16,8,.82);backdrop-filter:blur(4px);z-index:20;gap:34px;padding:0 96px;text-align:center}
  #ui .k{font-size:30px;letter-spacing:.4em;color:#e8b23f;text-transform:uppercase}
  #ui h1{font-size:100px;font-weight:700;color:#f4eeda;line-height:.95;text-transform:uppercase;transform:scaleX(.92)}
  #ui p{font-weight:700;font-size:40px;letter-spacing:.2em;color:#d9744f;text-transform:uppercase}
  #play{font-size:40px;font-weight:700;color:#1c2733;background:#e8b23f;border:none;border-radius:100px;
    padding:28px 78px;cursor:pointer;letter-spacing:.12em;text-transform:uppercase;box-shadow:0 10px 40px rgba(232,178,63,.4)}
  #play:hover{background:#f4cf6a}
  #ui.hide{opacity:0;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="paper"></div>
  <div id="rays"></div>
  <div id="sun"></div>
  <div class="cloud" style="top:200px;left:120px;width:280px" data-x="0"></div><div class="cloud" style="top:330px;right:120px;width:340px" data-x="0"></div><div class="cloud" style="top:150px;right:360px;width:200px" data-x="0"></div>
  <div id="skyline"></div>
  <div class="torn" style="top:150px;left:-40px;width:280px;height:200px;background:#b5402f;transform:rotate(-5deg)"></div><div class="torn" style="top:60px;right:-50px;width:300px;height:230px;background:#3f6b86;transform:rotate(4deg)"></div><div class="torn" style="bottom:280px;left:-30px;width:320px;height:240px;background:#3f6b86;transform:rotate(3deg)"></div><div class="torn" style="bottom:120px;left:210px;width:300px;height:210px;background:#c9a86a;transform:rotate(-4deg)"></div><div class="torn" style="bottom:150px;right:-40px;width:340px;height:260px;background:#b5402f;transform:rotate(5deg)"></div><div class="torn" style="bottom:340px;right:150px;width:250px;height:180px;background:#6f96ab;transform:rotate(-3deg)"></div><div class="torn" style="bottom:60px;right:250px;width:280px;height:170px;background:#8a4a34;transform:rotate(2deg)"></div>
  <div id="daisy"><div class="stem"></div><div class="bloom"><div class="core"></div></div></div>
  <div id="dust"></div>
  <div id="grain"></div>
  <div id="scenes"></div>
  <div id="vig"></div>
  <div id="bar"></div>
  <div id="ui">
    <div class="k">The Common Table</div>
    <h1>Give Us Back the Morning</h1>
    <p>the table belongs to everyone.</p>
    <button id="play">&#9654; Play</button>
  </div>
</div></div>
<audio id="bgm" src="give-us-back-the-morning-bgm.mp3" preload="auto"></audio>
<script>
  function fit(){const s=Math.min(window.innerWidth/1080,window.innerHeight/1920);
    document.getElementById('stage').style.setProperty('--s',s);}
  window.addEventListener('resize',fit);fit();
  const stage=document.getElementById('stage');
  // dust motes
  const dC=document.getElementById('dust'), MO=[];
  for(let i=0;i<26;i++){const x=((i*137.5)%100)/100*1080,dur=7+((i*53)%50)/10,phase=((i*29)%100)/100;
    const e=document.createElement('div');e.className='mote';e.style.left=x+'px';dC.appendChild(e);MO.push({e,dur,phase});}
  // daisy petals
  const bloom=document.querySelector('#daisy .bloom');
  for(let i=0;i<10;i++){const p=document.createElement('div');p.className='petal';
    p.style.transform=`translate(-50%,0) rotate(${i*36}deg)`;bloom.insertBefore(p,bloom.firstChild);}
  const rays=document.getElementById('rays'),sun=document.getElementById('sun'),
        clouds=[...document.querySelectorAll('.cloud')],torn=[...document.querySelectorAll('.torn')],
        daisy=document.getElementById('daisy'),bar=document.getElementById('bar');
  const scenes=[
    {d:4400, html:`<div class="scene"><div class="news"><div class="eyebrow">Extra &nbsp;&#9733;&nbsp; The Common Table</div><div class="head">We are more<br>than they<br>told us</div></div></div>`},
    {d:7000, html:`<div class="scene top"><div class="title">Give Us Back<br>The Morning</div><div class="rule"><i></i><b>&#9733;</b><i></i></div><div class="redsub">The Common Table</div></div>`},
    {d:5600, html:`<div class="scene"><div class="placard"><span class="md">The table</span><span class="big">belongs to</span><span class="md">everyone</span><span class="star">&#9733;</span></div></div>`},
    {d:5400, html:`<div class="scene"><div class="reprise">give us back<br>the morning.</div></div>`},
    {d:6600, html:`<div class="scene top"><div class="title">Give Us Back<br>The Morning</div><div class="rule"><i></i><b>&#9733;</b><i></i></div><div class="redsub">The Common Table</div><div class="tag">New Album</div></div>`}
  ];
  const total=scenes.reduce((a,s)=>a+s.d,0); window.TOTAL=total;
  const scenesEl=document.getElementById('scenes'); let t0=0; const S=[];
  scenes.forEach(sc=>{const w=document.createElement('div');w.innerHTML=sc.html;const el=w.firstElementChild;
    el.style.opacity=0;scenesEl.appendChild(el);S.push({el,start:t0,end:t0+sc.d});t0+=sc.d;});
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), frac=v=>v-Math.floor(v);
  function op(t,st,en){if(t<st||t>en)return 0;return clamp(Math.min((t-st)/800,(en-t)/560),0,1);}
  window.renderAt=function(t){
    const ts=t/1000;
    rays.style.transform=`translate(-50%,-50%) rotate(${ts*4}deg)`;
    sun.style.transform=`translate(-50%,-50%) scale(${1+0.03*Math.sin(ts/2.2)})`;
    clouds.forEach((c,i)=>{const base=+c.dataset.x; c.style.transform=`translateX(${Math.sin(ts/6+i)*22}px)`;
      c.style.opacity=(0.42+0.12*Math.sin(ts/4+i)).toFixed(2);});
    torn.forEach((c,i)=>{c.style.opacity=(0.55+0.1*Math.sin(ts/3+i*1.3)).toFixed(2);});
    daisy.style.transform=`rotate(${Math.sin(ts/2.2)*3}deg)`;
    for(const m of MO){const prog=frac((ts)/m.dur+m.phase);
      m.e.style.top=(1620-prog*1500)+'px';m.e.style.transform=`scale(${0.6+prog*0.7})`;
      m.e.style.opacity=(Math.sin(prog*Math.PI)*0.7).toFixed(2);}
    for(const s of S){s.el.style.opacity=op(t,s.start,s.end);}
    if(bar) bar.style.width=(clamp(t/total,0,1)*100)+'%';
  };
  window.renderAt(0);
  const params=new URLSearchParams(location.search), ui=document.getElementById('ui');
  if(params.has('capture')){ ui.style.display='none'; bar.style.display='none'; }
  else {
    const bgm=document.getElementById('bgm');
    document.getElementById('play').addEventListener('click',()=>{
      ui.classList.add('hide');
      try{bgm.currentTime=0;bgm.volume=.85;bgm.play().catch(()=>{});}catch(e){}
      const start=performance.now();
      (function loop(){const t=performance.now()-start;window.renderAt(Math.min(t,total));
        if(t<total)requestAnimationFrame(loop);
        else{ui.classList.remove('hide');document.getElementById('play').textContent='↻ Replay';}})();
      setTimeout(()=>{const fs=performance.now();(function fo(){const k=(performance.now()-fs)/1500;
        bgm.volume=Math.max(0,.85*(1-k));if(k<1)requestAnimationFrame(fo);else bgm.pause();})();}, total-1500);
    });
  }
</script>
</body>
</html>
